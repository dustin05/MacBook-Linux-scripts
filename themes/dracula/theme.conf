# Theme metadata (shell syntax). Every key is optional except DESC.
DESC="Dark purple/pink palette"
# GTK theme to download into ~/.themes (leave GTK_ZIP empty to skip)
GTK_ZIP="https://github.com/dracula/gtk/archive/master.zip"
GTK_DIR="gtk-master"      # top-level folder inside the zip
GTK_NAME="Dracula"        # name it gets in ~/.themes and gsettings
# yazi flavor installed with `ya pkg add` (leave empty to skip)
YAZI_FLAVOR="yazi-rs/flavors:dracula"
