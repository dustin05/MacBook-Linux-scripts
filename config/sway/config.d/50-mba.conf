### Trackpad (bcm5974 via libinput)
input type:touchpad {
    tap enabled
    tap_button_map lrm
    natural_scroll enabled
    dwt enabled
    click_method clickfinger
    middle_emulation enabled
    pointer_accel 0.3
}

### Mac Fn row
bindsym --locked XF86AudioRaiseVolume   exec wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+
bindsym --locked XF86AudioLowerVolume   exec wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindsym --locked XF86AudioMute          exec wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindsym --locked XF86MonBrightnessUp    exec brightnessctl set 5%+
bindsym --locked XF86MonBrightnessDown  exec brightnessctl set 5%-
bindsym --locked XF86KbdBrightnessUp    exec brightnessctl -d 'smc::kbd_backlight' set 10%+
bindsym --locked XF86KbdBrightnessDown  exec brightnessctl -d 'smc::kbd_backlight' set 10%-

### Launchers (Mod4 = Cmd)
bindsym Mod4+Return exec foot
bindsym Mod4+d exec fuzzel
bindsym Mod4+v exec sh -c 'cliphist list | fuzzel --dmenu | cliphist decode | wl-copy'
bindsym Mod4+Ctrl+l exec swaylock -f
bindsym Print exec sh -c 'grim -g "$(slurp)" - | swappy -f -'

### Autostart
exec mako
exec wl-paste --watch cliphist store
exec wlsunset -S 07:00 -s 19:00
exec /usr/libexec/polkit-gnome-authentication-agent-1

### swaybar (colors come from the theme file)
bar bar-0 {
    swaybar_command swaybar
    position top
    font pango:JetBrains Mono 10
    status_command ~/.config/sway/status.sh
}
